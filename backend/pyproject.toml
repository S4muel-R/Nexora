[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["core", "config"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py", "manage.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
