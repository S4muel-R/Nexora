# Integración continua de Nexora.
# Disparador: cada push a main y cada Pull Request (también los encadenados, cuya base es otra rama).
# Etapas: análisis estático → pruebas automatizadas con cobertura → compilación → artefactos (reportes de evidencia).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Django + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://nexora:nexora@localhost:5432/nexora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Análisis estático (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Migraciones completas
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - name: Pruebas con cobertura (pytest)
        run: >-
          pytest --cov --cov-report=term-missing --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/htmlcov --junitxml=reports/junit.xml
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: backend/reports/

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Análisis estático (eslint)
        run: npm run lint
      - name: Verificación de tipos (tsc)
        run: npm run typecheck
      - name: Pruebas unitarias (vitest)
        run: npm test
      - name: Compilación
        run: npm run build
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-frontend
          path: frontend/reports/

  e2e:
    name: Pruebas de sistema (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: |
          pip install -r backend/requirements-dev.txt
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium
      - name: Ejecutar recorridos en computadora y teléfono
        working-directory: frontend
        run: npm run e2e
      - name: Publicar reporte y capturas de evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e
          path: |
            frontend/reports/
            Docs/05-Pruebas/evidencias/e2e/
