# Ambiente local completo: PostgreSQL + API Django + interfaz React.
# Uso: docker compose up --build  →  interfaz http://localhost:5173, API http://localhost:8000/api/v1/health/
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: solo-para-desarrollo-local
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://nexora:nexora@db:5432/nexora
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
